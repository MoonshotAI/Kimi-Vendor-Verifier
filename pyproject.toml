[project]
name = "kimi-vendor-verifier"
version = "0.1.0"
description = "Kimi Vendor Verifier"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28.1",
    "inspect-ai>=0.3.158",
    "inspect-evals>=0.3.103",
    "jsonschema>=4.25.1",
    "loguru>=0.7.3",
    "math-verify>=0.8.0",
    "openai>=2.14.0",
    "pillow>=12.1.0",
    "pytest>=8.0",
    "pytest-rerunfailures>=14.0",
    "pytest-xdist>=3.5",
    "transformers>=5.14.1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "smoke_test: quick smoke tests",
    "flaky: tests that may be retried on failure",
]

[tool.setuptools]
py-modules = ["kimi_model", "aime2025", "mmmu_pro_vision", "ocr_bench", "eval", "load_aime_questions"]

[project.entry-points.inspect_ai]
kimi_vendor_verifier = "kimi_model"
